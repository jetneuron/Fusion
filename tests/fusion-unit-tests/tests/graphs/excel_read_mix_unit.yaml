name: example_graph

units:
  - id: uid1
    name: input_node
    type: DebugInputUnitTask
    config:
      times: 89
      column_count: 6
      interval: 0

  - id: uid2
    name: input_node
    type: DebugInputUnitTask
    config:
      times: 100
      column_count: 2
      interval: 0

  - id: uid3
    name: output_node
    type: DebugOutputUnitTask
    config:
      hide_console: true
      show_report: true

  - id: excel-input
    name: excel-input
    type: SpreadSheetUnitTask
    config:
      path: "{{CARGO_MANIFEST_DIR}}/tests/data/example_data_01.xlsx"
      sheet_name: "Sheet1"
      field_names:
        - name: "foo1"
          data_type: i32
        - name: "bar"
          data_type: str

  - id: uid4
    name: output_node
    type: DebugOutputUnitTask
    config:
      hide_console: true
      show_report: true

edges:
  - id: eid1
    source: uid1
    target: uid3
    config:
      fee: bee

  - id: eid2
    source: uid2
    target: uid3
    config:
      fee: bee

  - id: eid3
    source: uid3
    target: uid4
    config:
      fee: bee

  - id: eid4
    source: excel-input
    target: uid4
    config:
      fee: bee