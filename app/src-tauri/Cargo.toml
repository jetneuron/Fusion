[package]
name = "fusion-app"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
name = "fusion_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
