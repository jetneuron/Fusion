[package]
name = "fusion-unit-datafusion"
version = "0.1.0"
authors.workspace = true
homepage.workspace = true
edition.workspace = true
exclude = ["arrow-json"]

[dependencies]
fusion-derive = { path = "../fusion-derive" }
fusion-unit-sdk = { path = "../fusion-unit-sdk" }
datafusion = { version = "51.0.0", default-features = false, features = ["parquet", "sql"]}
protobuf = "3.7.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
serde = "1.0.216"
serde_json = "1.0.134"
async-trait = "0.1.83"

[dev-dependencies]

[lib]
crate-type = ["dylib", "lib"]
