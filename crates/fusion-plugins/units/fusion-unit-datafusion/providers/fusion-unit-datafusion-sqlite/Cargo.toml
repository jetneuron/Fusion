[package]
name = "fusion-unit-datafusion-sqlite"
version = "0.1.0"
authors.workspace = true
homepage.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Provider dylib: no DataFusion, no engine types. Rows cross the dylib
# boundary as SDK `Frame` protobufs — see fusion-unit-sdk `providers`.
fusion-unit-sdk = { path = "../../../../../../crates/fusion-unit-sdk" }
rusqlite = { version = "0.31", features = ["bundled"] }
async-trait = "0.1.83"
protobuf = "3.7"
serde_json = "1.0"
log = "0.4"
