[package]
name = "fusion-unit-datafusion"
version = "0.1.0"
authors.workspace = true
homepage.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
fusion-derive = { path = "../../../fusion-derive" }
fusion-streaming = { path = "../../../fusion-streaming" }
fusion-unit-sdk = { path = "../../../fusion-unit-sdk" }
fusion-capability-datafusion = { path = "../../capability/fusion-capability-datafusion" }
datafusion = { version = "=54.1.0", default-features = false, features = ["sql"] }
tokio = { version = "1.48.0", features = ["full"] }
mlua = { version = "0.10.2", features = ["lua54", "send", "async"] }
tera = "1.20.0"
anyhow = "1.0.100"
async-trait = "0.1.83"
protobuf = "3.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
