[package]
name = "fusion-unit-datafusion"
version = "0.1.0"
authors.workspace = true
homepage.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

# `cdylib` gates the `no_mangle` FFI exports. Crates that depend on this
# library (e.g. provider plugins that link the unit code in for reuse)
# disable it so their own dylibs don't accidentally export unit plugins.
[features]
default = ["cdylib"]
cdylib = []

[dependencies]
fusion-derive = { path = "../../../fusion-derive" }
fusion-unit-sdk = { path = "../../../fusion-unit-sdk" }
# Deliberately NOT linked here: the DataFusion engine lives only in the
# capability dylib (fusion-capability-datafusion). This unit talks to it
# through the SDK `CapabilitySqlEngine` trait and the C-ABI engine factory.
tokio = { version = "1.48.0", features = ["sync"] }
anyhow = "1.0.100"
log = "0.4"
async-trait = "0.1.83"
serde_json = "1.0"
