[package]
name = "fusion-unit-excel"
version = "0.1.0"
authors.workspace = true
homepage.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

# `cdylib` gates the `no_mangle` FFI exports. Crates that depend on this
# library disable it so their own dylibs don't accidentally export unit
# plugins.
[features]
default = ["cdylib"]
cdylib = []

[dependencies]
fusion-derive = { path = "../../../fusion-derive" }
fusion-unit-sdk = {path = "../../../fusion-unit-sdk" }
calamine = "0.25.0"
protobuf = "3.7.1"
anyhow = "1.0.95"
tokio = { version = "1.48.0", features = ["full"] }
rust_xlsxwriter = "0.84.0"
log = "0.4.29"

[dev-dependencies]
serde = { version = "1.0.156" }
serde_json = "1.0.94"