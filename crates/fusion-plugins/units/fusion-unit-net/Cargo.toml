[package]
name = "fusion-unit-net"
version = "0.1.0"
authors.workspace = true
homepage.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

# `cdylib` gates the `no_mangle` FFI exports. Crates that depend on this
# library disable it so their own dylibs don't accidentally export unit
# plugins.
[features]
default = ["cdylib"]
cdylib = []

[dependencies]
fusion-derive = { path = "../../../fusion-derive" }
fusion-unit-sdk = { path = "../../../fusion-unit-sdk" }
tokio = { version = "1.48.0", features = ["full"] }
serde = "1.0.216"
serde_json = "1.0.134"
ssh2 = "0.9.5"
protobuf = "3.7.1"
anyhow = "1.0.100"
hyper = { version = "1.8.1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
log = "0.4"
