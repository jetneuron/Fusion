name: example_graph

units:
  - id: uid1
    name: input_node
    type: DebugInputUnitTask
    version: builtin
    config:
      times: 10
      column_count: 3
      interval: 0

  - id: uid2
    name: output_node
    type: DebugOutputUnitTask
    version: builtin
    config:
      foo2: bar2
      int_field: 1.32

  - id: uid3
    name: output_node
    type: DebugOutputUnitTask
    version: builtin
    config:
      foo2: bar2
      int_field: 1.32

edges:
  - id: eid1
    source: uid1
    target: uid2
    config:
      fee: bee

  - id: eid2
    source: uid2
    target: uid3
    config:
      fee: bee

