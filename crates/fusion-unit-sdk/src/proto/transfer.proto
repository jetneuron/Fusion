syntax = "proto3";
package transfer;

option java_package = "com.fusionpro.proto";

/**
 * Frame — a unit of streaming data. Either a structured frame with one
 * or more columns (representing a row of a data set), or raw bytes via
 * the `raw` field. Generalized beyond "row" so byte-stream payloads
 * can flow through the same channel in the future.
 */
message Frame {
  /**
   * data offset
   */
  uint64 offset = 1;
  /**
   * include all columns in frame data.
   */
  repeated Column columns = 2;
  /**
   * mask value which can indicate the special frame data. eg: barrier, EOF and so on.
   */
  uint32 mask = 3;
  /**
   * source
   */
  string source = 4;
  /**
   * raw bytes payload — used when the frame carries a byte stream
   * instead of structured columns.
   */
  bytes raw = 5;
  /**
   * barrier reference offset — groups data frames from fan-out paths
   * back to the originating frame for barrier-based synchronization.
   */
  uint64 barrier_ref = 6;
}

// Supported data types.
enum DataType {
  str = 0;
  bool = 1;
  f64 = 2;
  f32 = 3;
  i32 = 4;
  i64 = 5;
  bytes = 6;
  json = 7;
  unknown = 8;
}

// Column struct in each structured frame.
message Column {
  uint32 index = 1;
  string field = 2;
  DataType dt = 3;
  bool is_null = 4;

  int32 i32_val = 5;
  int64 i64_val = 6;
  double f64_val = 7;
  float f32_val = 8;
  string str_val = 9;
  bool bool_val = 10;
  bytes bytes_val = 11;
}