[package]
name = "fusion-unit-sdk"
version = "0.1.0"
authors.workspace = true
homepage.workspace = true
edition.workspace = true

[dependencies]
protobuf = "3.7.1"
serde = { version = "1.0.156" }
# preserve_order must be pinned: `Value` layout differs between
# IndexMap (preserve_order) and BTreeMap, and `ComputingUnit` crosses
# binary images by value (host ↔ plugin dylibs). If the host tree
# enables it (e.g. via deno_core) but a dylib doesn't, `Value` has
# different sizes → `config` field offset shifts → UB at runtime.
serde_json = { version = "1.0.94", features = ["preserve_order"] }
serde_yaml = "0.9"
serde_derive = { version = "1.0" }
futures = "0.3"
tokio = { version = "1.48.0", features = ["sync", "rt", "time", "parking_lot"] }
lazy_static = "1.5.0"
log = "0.4.22"
thiserror = "1.0.61"
anyhow = "1.0.100"
parking_lot = "0.12.5"
linkme = "0.3.35"
async-trait = "0.1.83"
mlua = { version = "0.10.2", features = ["lua54", "send", "async"] }
