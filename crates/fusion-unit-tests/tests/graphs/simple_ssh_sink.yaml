name: example_graph

units:
  - id: uid1
    name: input_node
    type: SpreadSheetUnitTask
    config:
      path: "{{CARGO_MANIFEST_DIR}}/tests/data/test_skin_attribute_data.xlsx"
      sheet_name: "Sheet1"
      field_name_row_index: 1
      skip_rows: 3

  - id: uid2
    name: input_node
    type: SSHUnitTask
    config:
      host: 172.31.88.128
      port: 59522
      private_key: /Users/nigel/.ssh/company-ssh-key/tunnel_ssh_rsa/id_rsa
      shell: |
        echo "test" >> /tmp/data.test
      separator: "\t"

  - id: uid3
    name: output_node
    type: DebugOutputUnitTask
    config:
      hide_console: false
      show_report: true

edges:
