name: example_graph

units:

  - id: df
    name: datafusion
    type: DataFusionUnit
    config:
      sql: |
        select * from T
      local:
        - name: T
          paths:
            - "{{CARGO_MANIFEST_DIR}}/tests/data/simple_json_data.json"

  - id: printer
    name: output_node
    type: DebugOutputUnitTask
    config:
      foo2: bar2
      int_field: 1.32

edges:
  - id: eid1
    source: df
    target: printer
