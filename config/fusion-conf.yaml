# Fusion Server Mode Configuration
# Used for server-side / cluster deployments.

mode: cluster

# Dynamic library search paths.
libs:
  capability:
    - /opt/fusion/libs/capability
    - /usr/local/lib/fusion/capability
  unit:
    - /opt/fusion/libs/unit
    - /usr/local/lib/fusion/unit

# Configuration entries (three-level hierarchy: category → type → instance_id).
config:
  datasource:
    redis:
      redis-cache:
        host: ${REDIS_HOST:-localhost}
        port: 6379
        db: 0
        pool_size: 16
      redis-session:
        host: redis-cluster.internal
        port: 6379
        db: 1
    postgres:
      pg-analytics:
        host: ${PG_HOST:-localhost}
        port: 5432
        database: analytics
        user: ${PG_USER}
        password: ${PG_PWD}
    sqlite:
      # Referenced from graph YAML as `tables[*].provider: sqlite` with a
      # matching `config_id`. Example pointing at the integration-test
      # database; replace with a production path.
      sqlite-test-db:
        path: tests/fusion-unit-tests/tests/data/test_datafusion.db
        table: employees
  setting:
    pool:
      default:
        max_size: 16
        timeout_ms: 5000
  metadata:
    cluster:
      default:
        id: "fusion-cluster"
