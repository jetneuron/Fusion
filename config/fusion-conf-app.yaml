# Fusion App Mode Configuration
# Used when Fusion is embedded in a desktop application (e.g. Tauri).

mode: singleton

# Dynamic library search paths.
libs:
  capability:
    - assets/libs/capability
  unit:
    - assets/libs/unit

# Configuration entries (three-level hierarchy: category → type → instance_id).
config:
  datasource:
    redis:
      redis-local:
        host: localhost
        port: 6379
        db: 0
        pool_size: 8
  setting:
    pool:
      default:
        max_size: 16
        timeout_ms: 5000
  metadata:
    cluster:
      default:
        id: "fusion-app"
